name: kubling-kubernetes-semantics

services:
  descriptor-builder:
    image: docker.io/kubling/kubling-cli:latest
    command:
      - bundle
      - genmod
      - /descriptor
      - --output
      - /bundle/kubernetes-semantics-descriptor.zip
      - --parse
    volumes:
      - ./descriptor:/descriptor:ro
      - descriptor-bundle:/bundle

  k3s:
    image: docker.io/rancher/k3s:latest
    privileged: true
    command:
      - server
      - --disable=traefik
      - --tls-san=k3s
      - --write-kubeconfig=/shared/kubeconfig.raw.yaml
      - --write-kubeconfig-mode=644
    tmpfs:
      - /run
      - /var/run
    healthcheck:
      test:
        - CMD
        - kubectl
        - get
        - --raw=/readyz
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - kubeconfig:/shared

  cluster-bootstrap:
    image: docker.io/rancher/k3s:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed 's#server: https://127.0.0.1:6443#server: https://k3s:6443#'
        /shared/kubeconfig.raw.yaml > /shared/kubeconfig.yaml &&
        chmod 0644 /shared/kubeconfig.yaml &&
        kubectl --kubeconfig=/shared/kubeconfig.yaml apply -f /fixtures/fixture.yaml
    depends_on:
      k3s:
        condition: service_healthy
    volumes:
      - ./fixture.yaml:/fixtures/fixture.yaml:ro
      - kubeconfig:/shared

  provider:
    image: docker.io/kubling/kubernetes-provider:latest
    command:
      - -listen
      - :50051
      - -config
      - /config/provider-config.yaml
    depends_on:
      cluster-bootstrap:
        condition: service_completed_successfully
    expose:
      - "50051"
    volumes:
      - ./provider-config.yaml:/config/provider-config.yaml:ro
      - kubeconfig:/kubeconfig:ro

  provider-readiness:
    image: docker.io/fullstorydev/grpcurl:latest
    command:
      - -plaintext
      - -d
      - "{}"
      - provider:50051
      - kubling.provider.v1.ProviderService/Health
    depends_on:
      provider:
        condition: service_started
    restart: "on-failure:60"

  kubling:
    image: ${KUBLING_IMAGE:-docker.io/kubling/kubling:latest}
    environment:
      APP_CONFIG: /sample/app-config.yaml
      DESCRIPTOR_BUNDLE: /sample/bundle/kubernetes-semantics-descriptor.zip
      ENABLE_WEB_CONSOLE: "true"
      MAIN_HTTP_PORT: "8282"
      PROVIDER_HOST: provider
      PROVIDER_PORT: "50051"
    depends_on:
      descriptor-builder:
        condition: service_completed_successfully
      provider-readiness:
        condition: service_completed_successfully
    ports:
      - "8282:8282"
    volumes:
      - ./app-config.yaml:/sample/app-config.yaml:ro
      - descriptor-bundle:/sample/bundle:ro

  stack-readiness:
    image: docker.io/curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      kubling:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://kubling:8282/observe/health
      interval: 3s
      timeout: 5s
      retries: 80

  smoke-test:
    image: docker.io/curlimages/curl:latest
    profiles:
      - test
    environment:
      KUBLING_BASE_URL: http://kubling:8282
      KUBLING_VDB: KubernetesSemanticVDB
    depends_on:
      stack-readiness:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/smoke-test.sh"]
    volumes:
      - ./scripts/smoke-test.sh:/scripts/smoke-test.sh:ro

volumes:
  descriptor-bundle:
  k3s-data:
  kubeconfig:
