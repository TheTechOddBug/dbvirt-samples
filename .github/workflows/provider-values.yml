name: Provider Values

on:
  pull_request:
    paths:
      - ".github/workflows/provider-values.yml"
      - "provider-values/**"
      - "scripts/check-provider-values.sh"
  push:
    paths:
      - ".github/workflows/provider-values.yml"
      - "provider-values/**"
      - "scripts/check-provider-values.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-values-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-values:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate static contract
        run: bash scripts/check-provider-values.sh

      - name: Start Provider Values sample
        working-directory: provider-values
        run: docker compose up --wait --wait-timeout 180

      - name: Run typed-value smoke test
        working-directory: provider-values
        run: docker compose --profile test run --rm --no-deps smoke-test

      - name: Show logs after failure
        if: failure()
        working-directory: provider-values
        run: docker compose logs --no-color

      - name: Remove Provider Values sample
        if: always()
        working-directory: provider-values
        run: docker compose down --volumes --remove-orphans
